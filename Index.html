<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classificador com Teachable Machine</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .title-highlight {
      color: #38bdf8;
    }

    .camera-btn {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.35);
      transition: all 0.25s ease;
    }

    .camera-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 28px rgba(59, 130, 246, 0.45);
    }

    .camera-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .webcam-wrapper {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-container canvas {
      width: 100% !important;
      max-width: 420px;
      height: auto !important;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: block;
      margin: 0 auto;
    }

    .result-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .progress {
      height: 18px;
      border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-bar {
      font-size: 0.75rem;
      font-weight: 700;
      transition: width 0.25s ease;
    }

    .status-badge {
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      display: inline-block;
    }

    .muted-text {
      color: #cbd5e1;
    }

    @media (max-width: 576px) {
      .camera-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <div class="app-card p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="status-badge mb-3">Teachable Machine + HTML + Bootstrap</span>
            <h1 class="fw-bold mb-2">
              Classificador por <span class="title-highlight">Câmera</span>
            </h1>
            <p class="muted-text mb-0">
              Inicie a câmera para analisar em tempo real e visualizar o nível de correspondência de cada classe.
            </p>
          </div>

          <div class="row g-4 align-items-start">
            <div class="col-12 col-lg-6">
              <div class="webcam-wrapper mb-3">
                <div id="webcam-container" class="w-100 text-center">
                  <div class="muted-text">A câmera será exibida aqui.</div>
                </div>
              </div>

              <div class="d-grid d-sm-flex justify-content-center">
                <button
                  id="startButton"
                  type="button"
                  class="camera-btn"
                  onclick="init()"
                >
                  📷 Iniciar câmera
                </button>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="mb-3">
                <h2 class="h4 fw-bold mb-1">Resultados das classes</h2>
                <p class="muted-text mb-0">
                  As barras indicam a porcentagem de correspondência detectada pelo modelo.
                </p>
              </div>

              <div id="label-container" class="d-flex flex-column gap-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/fUbBylNZo/";

    let model, webcam, labelContainer, maxPredictions;
    let isRunning = false;

    async function init() {
      if (isRunning) return;

      const startButton = document.getElementById("startButton");
      const webcamContainer = document.getElementById("webcam-container");

      try {
        startButton.disabled = true;
        startButton.innerHTML = "⏳ Carregando câmera...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(320, 320, flip);
        await webcam.setup();
        await webcam.play();

        webcamContainer.innerHTML = "";
        webcamContainer.appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";

        for (let i = 0; i < maxPredictions; i++) {
          const item = document.createElement("div");
          item.className = "result-card";

          item.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="fw-semibold class-name">Classe ${i + 1}</span>
              <span class="fw-bold percentage-text">0%</span>
            </div>
            <div class="progress">
              <div
                class="progress-bar progress-bar-striped progress-bar-animated"
                role="progressbar"
                style="width: 0%;"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                0%
              </div>
            </div>
          `;

          labelContainer.appendChild(item);
        }

        isRunning = true;
        startButton.innerHTML = "✅ Câmera iniciada";
        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        startButton.disabled = false;
        startButton.innerHTML = "📷 Iniciar câmera";
        webcamContainer.innerHTML = `
          <div class="text-center text-warning">
            Não foi possível acessar a câmera ou carregar o modelo.
          </div>
        `;
      }
    }

    async function loop() {
      if (!isRunning) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      const cards = labelContainer.children;

      prediction.forEach((item, index) => {
        const probability = Math.round(item.probability * 100);
        const card = cards[index];
        const className = card.querySelector(".class-name");
        const percentageText = card.querySelector(".percentage-text");
        const progressBar = card.querySelector(".progress-bar");

        className.textContent = item.className;
        percentageText.textContent = `${probability}%`;
        progressBar.style.width = `${probability}%`;
        progressBar.setAttribute("aria-valuenow", probability);
        progressBar.textContent = `${probability}%`;

        progressBar.className = "progress-bar progress-bar-striped progress-bar-animated";

        if (probability >= 80) {
          progressBar.classList.add("bg-success");
        } else if (probability >= 50) {
          progressBar.classList.add("bg-info");
        } else if (probability >= 25) {
          progressBar.classList.add("bg-warning");
        } else {
          progressBar.classList.add("bg-danger");
        }
      });
    }
  </script>
</body>
</html>
